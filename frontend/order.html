<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track your order | ShopEase</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <h1 class="page-title">Track your order</h1>
    <div id="thanks"></div>
    <div class="two-col">
      <div id="order" class="panel">Enter your order number and email to see its status.</div>
      <form id="form" class="panel">
        <h3 style="margin-top:0">Find an order</h3>
        <label for="oid">Order number</label>
        <input id="oid" inputmode="numeric" required>
        <label for="email">Email used for the order</label>
        <input id="email" type="email" required>
        <div id="message"></div>
        <button class="btn" type="submit" style="width:100%;margin-top:16px">Track order</button>
      </form>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="js/common.js"></script>
  <script>
    renderLayout("track");
    const STEPS = ["PLACED", "PAID", "SHIPPED", "DELIVERED"];

    async function show(id, email) {
      try {
        const o = await api(`/orders/${id}?email=${encodeURIComponent(email)}`);
        const reached = STEPS.indexOf(o.status);
        const steps = o.status === "CANCELLED"
          ? '<div class="msg error">This order was cancelled.</div>'
          : `<div class="steps">${STEPS.map((s, i) => `<div class="step ${i <= reached ? "done" : ""}">${s}</div>`).join("")}</div>`;
        document.getElementById("order").innerHTML = `
          <h3 style="margin-top:0">Order #${o.id} <span class="status ${o.status}">${o.status}</span></h3>
          <p style="color:var(--muted)">Placed on ${escapeHtml(o.created_at)} for ${escapeHtml(o.customer_name)}</p>
          ${steps}
          ${o.items.map((it) => `<div class="summary-row"><span>${escapeHtml(it.product_name)} &times; ${it.qty}</span><span>${rupees(it.unit_price * it.qty)}</span></div>`).join("")}
          <div class="summary-row total"><span>Total</span><span>${rupees(o.total)}</span></div>
          <p style="color:var(--muted);font-size:14px">Delivering to: ${escapeHtml(o.address)}</p>`;
        document.getElementById("message").innerHTML = "";
      } catch (err) {
        showMessage(document.getElementById("message"), err.message);
      }
    }

    const params = new URLSearchParams(location.search);
    if (params.get("id")) {
      document.getElementById("oid").value = params.get("id");
      document.getElementById("email").value = params.get("email") || "";
      if (params.get("new")) {
        showMessage(document.getElementById("thanks"), `Thank you! Your order #${params.get("id")} has been placed. Keep this number to track it.`, "ok");
      }
      show(params.get("id"), params.get("email") || "");
    }
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      show(document.getElementById("oid").value.trim(), document.getElementById("email").value.trim());
    });
  </script>
</body>
</html>
