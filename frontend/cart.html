<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your cart | ShopEase</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <h1 class="page-title">Your cart</h1>
    <div id="message"></div>
    <div id="cart"></div>
  </main>
  <footer id="site-footer"></footer>

  <script src="js/common.js"></script>
  <script>
    renderLayout("cart");

    async function render() {
      const cart = getCart();
      const box = document.getElementById("cart");
      if (!cart.length) {
        box.innerHTML = '<div class="panel empty">Your cart is empty.<br><br><a class="btn" href="index.html">Start shopping</a></div>';
        return;
      }
      try {
        const products = await Promise.all(cart.map((line) => api("/products/" + line.id)));
        let total = 0;
        const rows = products.map((p, i) => {
          const qty = cart[i].qty;
          total += p.price * qty;
          return `<tr>
            <td style="font-size:32px;width:56px">${p.emoji}</td>
            <td><a href="product.html?id=${p.id}"><strong>${escapeHtml(p.name)}</strong></a><br>${stockLabel(p.stock)}</td>
            <td>${rupees(p.price)}</td>
            <td><div class="qty"><button data-id="${p.id}" data-d="-1">&minus;</button><span>${qty}</span><button data-id="${p.id}" data-d="1">+</button></div></td>
            <td><strong>${rupees(p.price * qty)}</strong></td>
            <td><button class="btn secondary small" data-remove="${p.id}">Remove</button></td>
          </tr>`;
        }).join("");
        box.innerHTML = `
          <div class="two-col">
            <div class="panel"><table>
              <tr><th></th><th>Product</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th></tr>${rows}
            </table></div>
            <div class="panel">
              <h3 style="margin-top:0">Order summary</h3>
              <div class="summary-row"><span>Items</span><span>${cartCount()}</span></div>
              <div class="summary-row"><span>Delivery</span><span>Free</span></div>
              <div class="summary-row total"><span>Total</span><span>${rupees(total)}</span></div>
              <a class="btn" style="width:100%;margin-top:12px" href="checkout.html">Checkout</a>
            </div>
          </div>`;
        box.querySelectorAll("button[data-d]").forEach((b) => b.addEventListener("click", () => {
          const c = getCart();
          const line = c.find((l) => l.id === Number(b.dataset.id));
          line.qty = Math.max(0, Math.min(10, line.qty + Number(b.dataset.d)));
          saveCart(c); render();
        }));
        box.querySelectorAll("button[data-remove]").forEach((b) => b.addEventListener("click", () => {
          saveCart(getCart().filter((l) => l.id !== Number(b.dataset.remove))); render();
        }));
      } catch (err) {
        showMessage(document.getElementById("message"), "Could not load your cart: " + err.message);
      }
    }
    render();
  </script>
</body>
</html>
