<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | ShopEase</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <h1 class="page-title">Store admin</h1>
    <form id="login" class="panel" style="max-width:420px">
      <label for="token" style="margin-top:0">Admin token (the ADMIN_TOKEN set on the server)</label>
      <input id="token" type="password" required>
      <button class="btn" type="submit" style="margin-top:14px">Open admin</button>
    </form>
    <div id="message"></div>
    <div id="admin" style="display:none">
      <div class="panel" style="margin-bottom:24px">
        <h3 style="margin-top:0">Orders</h3>
        <div id="orders"></div>
      </div>
      <div class="panel" style="margin-bottom:40px">
        <h3 style="margin-top:0">Stock</h3>
        <div id="stock"></div>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="js/common.js"></script>
  <script>
    renderLayout("");
    const STATUSES = ["PLACED", "PAID", "SHIPPED", "DELIVERED", "CANCELLED"];
    let token = sessionStorage.getItem("shopease_admin") || "";
    const auth = () => ({ "X-Admin-Token": token });

    async function load() {
      const msg = document.getElementById("message");
      try {
        const orders = await api("/admin/orders", { headers: auth() });
        sessionStorage.setItem("shopease_admin", token);
        document.getElementById("login").style.display = "none";
        document.getElementById("admin").style.display = "block";
        msg.innerHTML = "";
        document.getElementById("orders").innerHTML = orders.length ? `<table>
          <tr><th>#</th><th>Date</th><th>Customer</th><th>Total</th><th>Status</th><th>Change status</th></tr>
          ${orders.map((o) => `<tr>
            <td>${o.id}</td><td>${escapeHtml(o.created_at)}</td>
            <td>${escapeHtml(o.customer_name)}<br><span style="color:var(--muted);font-size:13px">${escapeHtml(o.email)}</span></td>
            <td>${rupees(o.total)}</td><td><span class="status ${o.status}">${o.status}</span></td>
            <td><select data-id="${o.id}">${STATUSES.map((s) => `<option ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}</select></td>
          </tr>`).join("")}</table>` : '<div class="empty">No orders yet.</div>';
        document.querySelectorAll("select[data-id]").forEach((sel) => sel.addEventListener("change", async () => {
          try {
            await api("/admin/orders/" + sel.dataset.id, { method: "PATCH", headers: auth(), body: JSON.stringify({ status: sel.value }) });
            load();
          } catch (err) { showMessage(msg, err.message); }
        }));
        const products = await api("/products");
        document.getElementById("stock").innerHTML = `<table><tr><th></th><th>Product</th><th>Price</th><th>Stock</th></tr>
          ${products.map((p) => `<tr><td>${p.emoji}</td><td>${escapeHtml(p.name)}</td><td>${rupees(p.price)}</td><td>${stockLabel(p.stock)} (${p.stock})</td></tr>`).join("")}</table>`;
      } catch (err) {
        sessionStorage.removeItem("shopease_admin");
        showMessage(msg, err.message);
      }
    }

    document.getElementById("login").addEventListener("submit", (e) => {
      e.preventDefault();
      token = document.getElementById("token").value;
      load();
    });
    if (token) load();
  </script>
</body>
</html>
